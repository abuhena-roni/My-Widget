<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age & Time Calc</title>
    <style>
        body {
            margin: 0; padding: 0;
            width: 240px; height: 320px;
            background-color: #121212; color: #ffffff;
            font-family: sans-serif; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .header {
            height: 28px; background-color: #1f1f1f;
            text-align: center; line-height: 28px; font-size: 13px; font-weight: bold;
            border-bottom: 1px solid #333;
        }
        .live-clock {
            height: 18px; background-color: #1a1a1a; color: #00ff00;
            text-align: center; line-height: 18px; font-size: 11px;
            border-bottom: 1px solid #222; font-family: monospace;
        }
        .content {
            flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 4px;
        }
        .input-group {
            display: flex; justify-content: space-between; align-items: center; gap: 5px;
        }
        .time-row {
            display: flex; gap: 5px; flex: 1;
        }
        label { font-size: 11px; color: #bbb; width: 55px; }
        input {
            background-color: #222; color: white;
            border: 1px solid #444; padding: 4px;
            border-radius: 4px; font-size: 11px; flex: 1; text-align: center;
        }
        /* ফোকাস বর্ডার */
        .focused, input:focus {
            border-color: #00ff00 !important; outline: none; background-color: #2d2d2d;
        }
        .result-box {
            flex: 1; margin-top: 2px; background-color: #161616;
            border-radius: 4px; padding: 4px; text-align: center;
            display: flex; flex-direction: column; justify-content: center;
            border: 1px solid #222;
        }
        .result-title { font-size: 10px; color: #888; margin-bottom: 2px; }
        .result-main { font-size: 12px; font-weight: bold; color: #00ff00; line-height: 1.4; }
        .software-keys {
            height: 20px; background-color: #1f1f1f; font-size: 11px;
            display: flex; justify-content: space-between; padding: 0 10px; line-height: 20px;
        }
    </style>
</head>
<body>

    <div class="header">বয়স ও সময় ক্যালকুলেটর</div>
    
    <!-- বর্তমান লাইভ সময় -->
    <div class="live-clock" id="clockBox">00:00:00 AM</div>

    <div class="content">
        <!-- তারিখ ইনপুট -->
        <div class="input-group">
            <label for="day">দিন/মাস:</label>
            <input type="number" id="day" class="focusable" placeholder="DD" min="1" max="31">
            <input type="number" id="month" class="focusable" placeholder="MM" min="1" max="12">
        </div>
        <div class="input-group">
            <label for="year">বছর (YYYY):</label>
            <input type="number" id="year" class="focusable" placeholder="Ex: 2002">
        </div>

        <!-- সময় ইনপুট (পাশাপাশি দুটি ছোট বক্স) -->
        <div class="input-group">
            <label>জন্ম সময়:</label>
            <div class="time-row">
                <input type="number" id="hour" class="focusable" placeholder="ঘণ্টা (0-23)" min="0" max="23">
                <input type="number" id="minute" class="focusable" placeholder="মিনিট (0-59)" min="0" max="59">
            </div>
        </div>
        
        <!-- লাইভ ফলাফল -->
        <div class="result-box">
            <div class="result-title">আপনার নিখুঁত বয়স</div>
            <div id="resultAge" class="result-main">ইনপুট দেওয়া শুরু করুন...</div>
            <div id="resultTime" class="result-main" style="color: #00e5ff;"></div>
        </div>
    </div>

    <div class="software-keys">
        <span>LSK: মেনু</span>
        <span>RSK: ব্যাক</span>
    </div>

    <script>
        // ১. বর্তমান ঘড়ি সচল রাখা
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clockBox').innerText = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
            
            // প্রতি সেকেন্ডে বয়স ক্যালকুলেশন আপডেট হবে যদি ইনপুট দেওয়া থাকে
            autoCalculateAgeAndTime();
        }
        setInterval(updateClock, 1000);

        // ২. রিয়েল-টাইম বয়স ও সময় ক্যালকুলেশন
        function autoCalculateAgeAndTime() {
            const now = new Date();

            const rawDay = document.getElementById('day').value;
            const rawMonth = document.getElementById('month').value;
            const rawYear = document.getElementById('year').value;
            const rawHour = document.getElementById('hour').value;
            const rawMinute = document.getElementById('minute').value;

            // যেকোনো একটি ফিল্ড পূরণ হলেই কাজ শুরু করবে
            if (!rawDay && !rawMonth && !rawYear && !rawHour && !rawMinute) {
                document.getElementById('resultAge').innerText = "ইনপুট দেওয়া শুরু করুন...";
                document.getElementById('resultTime').innerText = "";
                return;
            }

            // ফলব্যাক লজিক: ইনপুট ফাঁকা থাকলে বর্তমান সময়/তারিখ ধরে নেবে
            const birthDay = rawDay ? parseInt(rawDay) : now.getDate();
            const birthMonth = rawMonth ? parseInt(rawMonth) : now.getMonth() + 1;
            const birthYear = rawYear ? parseInt(rawYear) : now.getFullYear();
            const birthHour = rawHour ? parseInt(rawHour) : 0;     // ডিফল্ট রাত ১২টা
            const birthMinute = rawMinute ? parseInt(rawMinute) : 0; // ডিফল্ট ০ মিনিট

            // জন্ম তারিখ ও সময়ের একটি অবজেক্ট তৈরি
            const birthDate = new Date(birthYear, birthMonth - 1, birthDay, birthHour, birthMinute);

            if (birthDate > now) {
                document.getElementById('resultAge').innerText = "ভুল তারিখ/সময় দেওয়া হয়েছে!";
                document.getElementById('resultTime').innerText = "";
                return;
            }

            // বয়স ক্যালকুলেশন লজিক
            let calcYear = now.getFullYear() - birthDate.getFullYear();
            let calcMonth = now.getMonth() - birthDate.getMonth();
            let calcDay = now.getDate() - birthDate.getDate();
            let calcHour = now.getHours() - birthDate.getHours();
            let calcMinute = now.getMinutes() - birthDate.getMinutes();

            // মিনিট ঠিক করা
            if (calcMinute < 0) {
                calcMinute += 60;
                calcHour--;
            }
            // ঘণ্টা ঠিক করা
            if (calcHour < 0) {
                calcHour += 24;
                calcDay--;
            }
            // দিন ঠিক করা
            if (calcDay < 0) {
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                calcDay += prevMonth.getDate();
                calcMonth--;
            }
            // মাস ঠিক করা
            if (calcMonth < 0) {
                calcMonth += 12;
                calcYear--;
            }

            // স্ক্রিনে আউটপুট দেখানো
            document.getElementById('resultAge').innerText = `${calcYear} বছর, ${calcMonth} মাস, ${calcDay} দিন`;
            document.getElementById('resultTime').innerText = `${calcHour} ঘণ্টা, ${calcMinute} মিনিট`;
        }

        // সব ইনপুটে লাইভ লিসেনার যোগ করা
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', autoCalculateAgeAndTime);
        });

        // ৩. কিপ্যাড নেভিগেশন (৫টি বক্স ক্রমান্বয়ে ঘুরবে)
        let focusables = document.querySelectorAll('.focusable');
        let focusIndex = 0;

        function applyFocus() {
            focusables.forEach((el, idx) => {
                if (idx === focusIndex) {
                    el.classList.add('focused');
                    el.focus();
                } else {
                    el.classList.remove('focused');
                }
            });
        }
        applyFocus();

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                focusIndex = (focusIndex + 1) % focusables.length;
                applyFocus();
                e.preventDefault();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                focusIndex = (focusIndex - 1 + focusables.length) % focusables.length;
                applyFocus();
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
