<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calc</title>
    <style>
        body {
            margin: 0; padding: 0;
            width: 240px; height: 320px;
            background-color: #121212; color: #ffffff;
            font-family: sans-serif; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .header {
            height: 30px; background-color: #1f1f1f;
            text-align: center; line-height: 30px; font-size: 14px; font-weight: bold;
            border-bottom: 1px solid #333;
        }
        .content {
            flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px;
        }
        .input-group {
            display: flex; justify-content: space-between; align-items: center; gap: 5px;
        }
        label { font-size: 11px; color: #bbb; width: 60px; }
        /* কিপ্যাড ফ্রেন্ডলি ইনপুট ও বাটন */
        input, button {
            background-color: #222; color: white;
            border: 1px solid #444; padding: 5px;
            border-radius: 4px; font-size: 12px; flex: 1;
        }
        button {
            width: 100%; margin-top: 5px; background-color: #0088cc; border: none; font-weight: bold;
        }
        /* ফোকাস বর্ডার গাইডলাইন অনুযায়ী */
        .focused, input:focus, button:focus {
            border-color: #00ff00 !important; outline: none; background-color: #2d2d2d;
        }
        .result-box {
            flex: 1; margin-top: 5px; background-color: #1a1a1a;
            border-radius: 4px; padding: 6px; text-align: center;
            display: flex; flex-direction: column; justify-content: center; gap: 4px;
        }
        .result-title { font-size: 11px; color: #888; }
        .result-main { font-size: 15px; font-weight: bold; color: #00ff00; }
        .software-keys {
            height: 22px; background-color: #1f1f1f; font-size: 11px;
            display: flex; justify-content: space-between; padding: 0 10px; line-height: 22px;
        }
    </style>
</head>
<body>

    <div class="header">বয়স ক্যালকুলেটর</div>

    <div class="content">
        <!-- জন্ম তারিখ ইনপুট ফর্ম -->
        <div class="input-group">
            <label for="day">দিন (DD):</label>
            <input type="number" id="day" class="focusable" placeholder="Ex: 15" min="1" max="31">
        </div>
        <div class="input-group">
            <label for="month">মাস (MM):</label>
            <input type="number" id="month" class="focusable" placeholder="Ex: 12" min="1" max="12">
        </div>
        <div class="input-group">
            <label for="year">বছর (YYYY):</label>
            <input type="number" id="year" class="focusable" placeholder="Ex: 2002">
        </div>

        <button id="calcBtn" class="focusable">হিসাব করুন (Enter)</button>
        
        <!-- ফলাফল দেখানোর জায়গা -->
        <div class="result-box" id="resultBox">
            <div class="result-title">আপনার বর্তমান বয়স</div>
            <div class="result-main" id="resultOutput">-- বছর -- মাস -- দিন</div>
        </div>
    </div>

    <div class="software-keys">
        <span>LSK: অপশন</span>
        <span>RSK: ব্যাক</span>
    </div>

    <script>
        // বয়স হিসাব করার লজিক
        function calculateAge() {
            const birthDay = parseInt(document.getElementById('day').value);
            const birthMonth = parseInt(document.getElementById('month').value);
            const birthYear = parseInt(document.getElementById('year').value);

            if (!birthDay || !birthMonth || !birthYear) {
                alert('দয়া করে সবগুলো বক্স সঠিকভাবে পূরণ করুন!');
                return;
            }

            const today = new Date();
            let currentDay = today.getDate();
            let currentMonth = today.getMonth() + 1; // 0-based index তাই +1
            let currentYear = today.getFullYear();

            const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            // লিপ ইয়ার চেক
            if ((currentYear % 4 === 0 && currentYear % 100 !== 0) || (currentYear % 400 === 0)) {
                monthDays[1] = 29;
            }

            if (birthDay > currentDay) {
                currentDay = currentDay + monthDays[currentMonth - 2];
                currentMonth = currentMonth - 1;
            }
            if (birthMonth > currentMonth) {
                currentMonth = currentMonth + 12;
                currentYear = currentYear - 1;
            }

            const calculatedDay = currentDay - birthDay;
            const calculatedMonth = currentMonth - birthMonth;
            const calculatedYear = currentYear - birthYear;

            if(calculatedYear < 0) {
                alert('জন্মসাল বর্তমান সালের চেয়ে বড় হতে পারে না!');
                return;
            }

            // স্ক্রিনে রেজাল্ট দেখানো
            document.getElementById('resultOutput').innerText = 
                `${calculatedYear} বছর, ${calculatedMonth} মাস, ${calculatedDay} দিন`;
        }

        // কিপ্যাড নেভিগেশন (Arrow Keys) কন্ট্রোল
        let focusables = document.querySelectorAll('.focusable');
        let focusIndex = 0;

        function applyFocus() {
            focusables.forEach((el, idx) => {
                if (idx === focusIndex) {
                    el.classList.add('focused');
                    el.focus();
                } else {
                    el.classList.remove('focused');
                }
            });
        }
        
        applyFocus(); // শুরুতে প্রথম ইনপুট ফোকাসড থাকবে

        document.addEventListener('keydown', function(e) {
            // ইনপুট বক্সে টাইপ করার সময় যেন শুধু Up/Down চাপলে ফোকাস বদলায়
            if (document.activeElement.tagName === 'INPUT') {
                if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            }

            if (e.key === 'ArrowDown') {
                focusIndex = (focusIndex + 1) % focusables.length;
                applyFocus();
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                focusIndex = (focusIndex - 1 + focusables.length) % focusables.length;
                applyFocus();
                e.preventDefault();
            } else if (e.key === 'Enter') {
                if(focusables[focusIndex].id === 'calcBtn') {
                    calculateAge();
                }
            }
        });
    </script>
</body>
</html>
