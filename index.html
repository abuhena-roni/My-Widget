<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calc Live</title>
    <style>
        body {
            margin: 0; padding: 0;
            width: 240px; height: 320px;
            background-color: #121212; color: #ffffff;
            font-family: sans-serif; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .header {
            height: 30px; background-color: #1f1f1f;
            text-align: center; line-height: 30px; font-size: 13px; font-weight: bold;
            border-bottom: 1px solid #333;
        }
        /* ঘড়ি ও লাইভ টাইমের স্টাইল */
        .live-clock {
            height: 20px; background-color: #1a1a1a; color: #00ff00;
            text-align: center; line-height: 20px; font-size: 11px;
            border-bottom: 1px solid #222; font-family: monospace;
        }
        .content {
            flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 5px;
        }
        .input-group {
            display: flex; justify-content: space-between; align-items: center; gap: 5px;
        }
        label { font-size: 11px; color: #bbb; width: 60px; }
        input {
            background-color: #222; color: white;
            border: 1px solid #444; padding: 4px;
            border-radius: 4px; font-size: 12px; flex: 1;
        }
        /* ফোকাস বর্ডার */
        .focused, input:focus {
            border-color: #00ff00 !important; outline: none; background-color: #2d2d2d;
        }
        .result-box {
            flex: 1; margin-top: 4px; background-color: #161616;
            border-radius: 4px; padding: 6px; text-align: center;
            display: flex; flex-direction: column; justify-content: center; gap: 2px;
            border: 1px solid #222;
        }
        .result-title { font-size: 11px; color: #888; }
        .result-main { font-size: 13px; font-weight: bold; color: #00ff00; }
        .software-keys {
            height: 22px; background-color: #1f1f1f; font-size: 11px;
            display: flex; justify-content: space-between; padding: 0 10px; line-height: 22px;
        }
    </style>
</head>
<body>

    <div class="header">বয়স ক্যালকুলেটর</div>
    
    <!-- লাইভ টাইম দেখানোর বক্স -->
    <div class="live-clock" id="clockBox">00:00:00 AM</div>

    <div class="content">
        <div class="input-group">
            <label for="day">দিন (DD):</label>
            <input type="number" id="day" class="focusable" placeholder="Ex: 15" min="1" max="31">
        </div>
        <div class="input-group">
            <label for="month">মাস (MM):</label>
            <input type="number" id="month" class="focusable" placeholder="Ex: 12" min="1" max="12">
        </div>
        <div class="input-group">
            <label for="year">বছর (YYYY):</label>
            <input type="number" id="year" class="focusable" placeholder="Ex: 2002">
        </div>
        
        <div class="result-box">
            <div class="result-title">আপনার বয়স (রিয়েল-টাইম)</div>
            <div class="result-main" id="resultOutput">ইনপুট দেওয়া শুরু করুন...</div>
        </div>
    </div>

    <div class="software-keys">
        <span>LSK: মেনু</span>
        <span>RSK: ব্যাক</span>
    </div>

    <script>
        // ১. লাইভ ঘড়ি সচল করার লজিক
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 হলে 12 দেখাবে
            const timeString = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
            
            document.getElementById('clockBox').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock(); // শুরুতে একবার কল করা

        // ২. রিয়েল-টাইম বয়স হিসাব (যেকোনো একটা ফিল্ড পূরণ করলেই কাজ করবে)
        function autoCalculateAge() {
            // যদি কোনো ফিল্ড খালি থাকে, তবে সেটিকে ডিফল্ট মান হিসেবে আজকের দিন/মাস/সাল ধরে নেবে
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth() + 1;
            const currentYear = today.getFullYear();

            const rawDay = document.getElementById('day').value;
            const rawMonth = document.getElementById('month').value;
            const rawYear = document.getElementById('year').value;

            // যেকোনো একটা বক্সে ভ্যালু আছে কিনা চেক
            if (!rawDay && !rawMonth && !rawYear) {
                document.getElementById('resultOutput').innerText = "ইনপুট দেওয়া শুরু করুন...";
                return;
            }

            // ফাল ব্যাক (Fallback) লজিক: ইউজার যা খালি রাখবে, সেখানে আজকের ডেট বসে যাবে
            const birthDay = rawDay ? parseInt(rawDay) : currentDay;
            const birthMonth = rawMonth ? parseInt(rawMonth) : currentMonth;
            const birthYear = rawYear ? parseInt(rawYear) : currentYear;

            let calcDay = currentDay;
            let calcMonth = currentMonth;
            let calcYear = currentYear;

            const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            if ((calcYear % 4 === 0 && calcYear % 100 !== 0) || (calcYear % 400 === 0)) {
                monthDays[1] = 29;
            }

            if (birthDay > calcDay) {
                calcDay = calcDay + monthDays[calcMonth - 2 < 0 ? 11 : calcMonth - 2];
                calcMonth = calcMonth - 1;
            }
            if (birthMonth > calcMonth) {
                calcMonth = calcMonth + 12;
                calcYear = calcYear - 1;
            }

            const finalDay = calcDay - birthDay;
            const finalMonth = calcMonth - birthMonth;
            const finalYear = calcYear - birthYear;

            if (finalYear < 0 || (finalYear === 0 && finalMonth === 0 && finalDay < 0)) {
                document.getElementById('resultOutput').innerText = "ভুল তারিখ দেওয়া হয়েছে!";
                return;
            }

            document.getElementById('resultOutput').innerText = 
                `${finalYear} বছর, ${finalMonth} মাস, ${finalDay} দিন`;
        }

        // ইনপুট বক্সগুলোতে ইভেন্ট লিসেনার যোগ করা (টাইপ করার সাথে সাথে রান হবে)
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', autoCalculateAge);
        });

        // ৩. কিপ্যাড নেভিগেশন (Arrow Keys) কন্ট্রোল
        let focusables = document.querySelectorAll('.focusable');
        let focusIndex = 0;

        function applyFocus() {
            focusables.forEach((el, idx) => {
                if (idx === focusIndex) {
                    el.classList.add('focused');
                    el.focus();
                } else {
                    el.classList.remove('focused');
                }
            });
        }
        applyFocus();

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown') {
                focusIndex = (focusIndex + 1) % focusables.length;
                applyFocus();
                e.preventDefault();
            } else if (e.key === 'ArrowUp') {
                focusIndex = (focusIndex - 1 + focusables.length) % focusables.length;
                applyFocus();
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
